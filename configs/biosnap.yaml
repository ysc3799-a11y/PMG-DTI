DATA:
  CSV: data/interim/biosnap/pairs_with_pid/full_with_pid.csv
  # Generate these files first with scripts/make_fivefold_splits.py.
  # Fold 0 is the default entry; scripts/run_fivefold.py overrides it for folds 1--4.
  SPLIT: splits/biosnap/fivefold_seed42/biosnap_fivefold_seed42_fold0.json
  PHARM: data/interim/biosnap/pharm_features/pharm_fixed64_legacy.pt
  ESM2: data/interim/biosnap/esm2_tokens/esm2_tokens_t6_fp16.pt
  MASK_SPECIAL_TOKENS: 0

  P2RANK_WORK_DIR: data/raw/biosnap/p2rank_raw
  PROTEIN_POCKETS_CSV: data/raw/biosnap/p2rank_raw/protein_pockets.csv
  PDB_INDEX_CSV: data/raw/biosnap/p2rank_raw/pdb_index.csv
  P2RANK_OUT_DIR: data/raw/biosnap/p2rank_raw
  POCKET_CACHE_DIR: data/processed/biosnap/pocket_graph_cache_top3_prob01_expand0
  DRUG_GRAPH_CACHE: data/processed/biosnap/drug_graph_cache/drug_graph_cache.pt

  PROTEIN_ID_COL: Protein_ID
  POCKET_TOPK: 3
  POCKET_MAX_NODES: 96
  POCKET_KNN_K: 16
  POCKET_EXPAND_MIN_NODES: 0
  POCKET_SEQDIST_NORM: log1p
  POCKET_SEQDIST_NORM_DENOM: 128.0
  POCKET_EDGE_RBF_BINS: 16
  POCKET_EDGE_RBF_DMIN: 0.0
  POCKET_EDGE_RBF_DMAX: 20.0

  # Pocket node features: ESM-2 + residue type + physicochemical + pLDDT + spatial descriptors.
  POCKET_STRUCT_FEAT: 1
  POCKET_USE_STRUCT_FEAT: 1
  POCKET_STRUCT_DIM: 29

  POCKET_PROB_THRES: 0.1
  POCKET_MIN_RESIDUES: 8
  POCKET_RAW_ONLY: 1
  POCKET_EDGE_MODE: radius
  POCKET_RADIUS_CUTOFF: 10.0
  POCKET_RADIUS_MAX_NEIGHBORS: 32

  NO_PHARM: 0
  DROP_NO_POCKET: 0

MODEL:
  NODE_IN: 74

  # strong shared trunk
  GCN_HIDDEN: 160
  GCN_OUT: 160
  GCN_LAYERS: 3

  NUM_PHARM_TYPES: 64
  PHARM_EMB: 96
  PHARM_OUT: 96
  PHARM_POOL: attn
  PHARM_SELF_ATTN: 0
  PHARM_SELF_NHEAD: 4
  PHARM_SELF_DROPOUT: 0.1
  PROT_POOL: attn

  USE_ANCHOR: 1
  PHARM_USE_GRAPH_ATTN: 1

  USE_POCKET: 1
  USE_MULTIVIEW: 0

  # strong no-pocket trunk migrated back
  USE_PP_ATTN: 1
  PP_ATTN_DROPOUT: 0.1

  # pocket branch
  POCKET_DIM: 128
  POCKET_NODE_PROJ: 128
  POCKET_GNN_HIDDEN: 128
  POCKET_GNN_LAYERS: 2
  POCKET_EDGE_FEAT_DIM: 21
  POCKET_EDGE_HIDDEN: 64
  POCKET_INST_POOL: softmax
  POCKET_SCORE_PRIOR: 1
  POCKET_SCORE_SCALE: 1.0

  # keep current clean/light pocket settings
  POCKET_POOL: softmax
  POCKET_K: 32
  POCKET_MIN_KEEP: 8
  POCKET_TAU: 0.7
  POCKET_DETACH_SCORE: 1
  POCKET_INSTANCES: 1

  # h_set / local-set settings
  USE_SET_VIEW: 1
  SET_TOP_PAIR_PER_POCKET: 2
  SET_MAX_TOKENS: 6
  SET_MAX_PER_PHARM_TOKEN: 1
  SET_MAX_PER_POCKET_NODE: 1
  SET_NUM_LAYERS: 1
  SET_NUM_HEADS: 4
  SET_DROPOUT: 0.1
  USE_SET_CLS: 0
  SET_GATE_INIT_BIAS: -1.0

  # new local/pair-set split controls
  USE_PAIR_COVERAGE: 1
  COVERAGE_THR: 0.5
  USE_POCKET_TOKEN: 1
  LOCAL_SET_INIT: 0.3
  LOCAL_MATCH_TAU: 0.7
  LOCAL_EVIDENCE_GATE: 1
  LOCAL_EVIDENCE_POOL: logsumexp
  LOCAL_EVIDENCE_SCORE_SCALE: 0.5
  LOCAL_POCKET_BIAS_SCALE: 1.0
  USE_CONTRIBUTION_CALIBRATION: 1
  CONTRIB_CALIB_TOP_FRAC: 0.2
  CONTRIB_CALIB_MIN_PAIRS: 2
  USE_GLOBAL_INTERACTION_ALIGN: 1

  USE_SOFT_POCKET_BIAS: 1
  PP_GATE_INIT: 0.0
  PP_ATTN_GATE_INIT: 0.5
  POCKET_BIAS_MARGIN: 0.45
  POCKET_BIAS_POOL: max
  POCKET_BIAS_USE_PRIOR: 1
  POCKET_BIAS_PRIOR_POWER: 1.0
  POCKET_BIAS_REDUCE: max
  POCKET_BIAS_L2NORM: 1

  FUSION_DIM: 320
  GATE_HIDDEN: 320
  MLP_HIDDEN: 320
  DROPOUT: 0.1
  POCKET_USE_STRUCT_FEAT: 1
  POCKET_STRUCT_DIM: 29

SOLVER:
  SEED: 42
  DEVICE: cuda:0
  EPOCHS: 50
  BATCH_SIZE: 16
  LR: 0.0003
  WEIGHT_DECAY: 0.00003
  MAIN_METRIC: auc
  AMP: 1
  # Keep the effective batch size equal to the reported batch size (16).
  GRAD_ACCUM: 1
  NUM_WORKERS: 0
  SCHEDULER: cosine
  MIN_LR: 0.00001
  LABEL_SMOOTHING: 0.0
  EMA: 1
  EMA_DECAY: 0.999
  PAIRWISE_AUC_LOSS_WEIGHT: 0.20
  PAIRWISE_WARMUP_EPOCHS: 0
  LOCAL_EVIDENCE_LOSS_WEIGHT: 0.05
  LOCAL_EVIDENCE_WARMUP_EPOCHS: 0
  CONTRIBUTION_CALIB_LOSS_WEIGHT: 0.02
  CONTRIBUTION_CALIB_WARMUP_EPOCHS: 5
  CONTRIBUTION_CALIB_MARGIN: 0.2
  CONTRIBUTION_CALIB_LOW_WEIGHT: 0.5
  CONTRIBUTION_CALIB_KEEP_WEIGHT: 0.5
  GLOBAL_ALIGN_LOSS_WEIGHT: 0.01
  GLOBAL_ALIGN_WARMUP_EPOCHS: 5
  CONSISTENCY_LOSS_WEIGHT: 0.05
  EARLY_STOPPING_PATIENCE: 8
  EARLY_STOPPING_MIN_DELTA: 0.00005

RESULT:
  SAVE_DIR: runs/pharm_evidence
  RUN_NAME: biosnap_pmg_dti_fivefold
