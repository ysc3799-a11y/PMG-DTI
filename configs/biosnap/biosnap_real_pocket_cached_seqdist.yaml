DATA:
  CSV: data/interim/biosnap/pairs_with_pid/full_with_pid.csv
  SPLIT: data/processed/biosnap/splits/biosnap_random_seed42.json
  PHARM: data/interim/biosnap/pharm_features/pharm_max64_seed42.pt
  ESM2: data/interim/biosnap/esm2_tokens/esm2_tokens_t6_fp16.pt
  MASK_SPECIAL_TOKENS: 1

  P2RANK_WORK_DIR: data/raw/biosnap/p2rank_raw
  PROTEIN_POCKETS_CSV: data/raw/biosnap/p2rank_raw/protein_pockets.csv
  PDB_INDEX_CSV: data/raw/biosnap/p2rank_raw/pdb_index.csv
  P2RANK_OUT_DIR: data/raw/biosnap/p2rank_raw
  POCKET_CACHE_DIR: data/processed/biosnap/pocket_graph_cache_top3_prob01_expand0
  DRUG_GRAPH_CACHE: data/processed/biosnap/drug_graph_cache/drug_graph_cache.pt

  PROTEIN_ID_COL: Protein_ID
  POCKET_TOPK: 3
  POCKET_MAX_NODES: 96
  POCKET_KNN_K: 16
  POCKET_PROB_THRES: 0.1
  POCKET_MIN_RESIDUES: 8
  POCKET_EXPAND_MIN_NODES: 0
  POCKET_STRUCT_FEAT: 0
  POCKET_USE_STRUCT_FEAT: 0
  DROP_NO_POCKET: 1

MODEL:
  NODE_IN: 74
  GCN_HIDDEN: 128
  GCN_OUT: 128
  GCN_LAYERS: 2

  NUM_PHARM_TYPES: 64
  PHARM_EMB: 64
  PHARM_OUT: 64
  PHARM_POOL: "attn"
  PHARM_SELF_ATTN: 0
  PHARM_SELF_NHEAD: 4
  PHARM_SELF_DROPOUT: 0.1

  PROT_POOL: "attn"

  USE_POCKET: 1
  USE_MULTIVIEW: 0
  USE_PP_ATTN: 0

  POCKET_DIM: 128
  POCKET_NODE_PROJ: 192
  POCKET_GNN_HIDDEN: 192
  POCKET_GNN_LAYERS: 4
  POCKET_EDGE_HIDDEN: 64
  POCKET_EDGE_FEAT_DIM: 21
  POCKET_INST_POOL: "attn"
  POCKET_SCORE_PRIOR: 1
  POCKET_SCORE_SCALE: 1.0

  FUSION_DIM: 320
  GATE_HIDDEN: 320
  MLP_HIDDEN: 320
  DROPOUT: 0.2

  USE_ANCHOR: 1
  PHARM_USE_GRAPH_ATTN: 1

SOLVER:
  SEED: 42
  DEVICE: cuda:0
  EPOCHS: 50
  BATCH_SIZE: 16
  LR: 0.0003
  WEIGHT_DECAY: 0.00003
  MAIN_METRIC: auc
  AMP: 1
  GRAD_ACCUM: 4
  NUM_WORKERS: 0

RESULT:
  SAVE_DIR: runs/biosnap
  RUN_NAME: biosnap_real_pocket_cached_seqdist
  SAVE_LAST: false
