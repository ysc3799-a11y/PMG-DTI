DATA:
  # Relative to baselines/concat_pharm_esm2_ppattn_baseline
  CSV: data/human/full_with_pid.csv
  SPLIT: data/human/splits/human_random_seed42.json
  PHARM: data/human/precomputed/pharm_max64_seed42.pt
  ESM2: data/human/precomputed/esm2_tokens_t6_fp16.pt
  MASK_SPECIAL_TOKENS: 1

  # P2Rank / PDB (can be omitted if POCKET_CACHE_DIR already populated)
  P2RANK_WORK_DIR: ../afdb_p2rank_pipeline/work

  # Offline pocket-graph cache directory
  POCKET_CACHE_DIR: data/human/precomputed/pocket_graph_cache_seqdist_p0p1_min8

  # Pocket graph build settings (must match cache build settings)
  POCKET_TOPK: 3
  POCKET_MAX_NODES: 96
  POCKET_KNN_K: 16
  POCKET_PROB_THRES: 0.1
  POCKET_MIN_RESIDUES: 8
  POCKET_EXPAND_MIN_NODES: 32
  DROP_NO_POCKET: 1

MODEL:
  # drug graph (canonical atom features -> 74 dims)
  NODE_IN: 74
  GCN_HIDDEN: 128
  GCN_OUT: 128
  GCN_LAYERS: 2

  # pharm tokens
  NUM_PHARM_TYPES: 64
  PHARM_EMB: 64
  PHARM_OUT: 64
  PHARM_POOL: "attn"          # "mean" or "attn"
  PHARM_SELF_ATTN: 0
  PHARM_SELF_NHEAD: 4
  PHARM_SELF_DROPOUT: 0.1

  # protein
  PROT_POOL: "attn"   # "mean" or "attn"

  # pocket graph encoder
  USE_POCKET: 1
  POCKET_DIM: 128
  POCKET_NODE_PROJ: 192
  POCKET_GNN_HIDDEN: 192
  POCKET_GNN_LAYERS: 4
  POCKET_EDGE_HIDDEN: 64
  POCKET_EDGE_FEAT_DIM: 2
  POCKET_INST_POOL: "attn"    # "attn" or "mean"
  POCKET_SCORE_PRIOR: 1
  POCKET_SCORE_SCALE: 1.0

  # gated fusion head
  FUSION_DIM: 320
  GATE_HIDDEN: 320
  MLP_HIDDEN: 320
  DROPOUT: 0.2

  # switches
  USE_ANCHOR: 1
  PHARM_USE_GRAPH_ATTN: 1

SOLVER:
  SEED: 42
  DEVICE: cuda:0
  EPOCHS: 50
  BATCH_SIZE: 16
  LR: 0.0003
  WEIGHT_DECAY: 0.00003
  MAIN_METRIC: auc      # auc or auprc
  AMP: 1
  GRAD_ACCUM: 4
  NUM_WORKERS: 0

RESULT:
  SAVE_DIR: runs/real_pocket_cached
  RUN_NAME: "human_real_pocket_cached_seqdist_pocketplus"
  SAVE_LAST: false
